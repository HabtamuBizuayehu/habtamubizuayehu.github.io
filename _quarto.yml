
project:
  type: website
  output-dir: docs

website:
  title: "Habtamu Bizuayehu"
  navbar:
    pinned: true
    background: "#4a1c1c"
    foreground: "#f8f8f4"
    logo: top_logo.jpg   # your image file (ensure it's in the same folder)
    logo-alt: "Habtamu Bizuayehu"
    logo-href: index.qmd

    # logo: top_logo.jpg
    left:
      # - text: "Habtamu Bizuayehu"
      #   file: index.qmd
      # - text: "<div style='display:flex; align-items:center;'>
      #             <img src='top_logo.jpg' alt='Habtamu Bizuayehu' style='height:45px; border-radius:6px; margin-right:10px;'>
      #             <span style='font-weight:600; font-size:1.2rem; color:#f8f8f4;'>Habtamu Bizuayehu</span>
      #           </div>"
      #   href: index.qmd
      - text: "About Me"
        file: about.qmd
      - text: "Skills and Expertise"
        file: Skillsets.qmd
      - text: "Resume/CV"
        file: CV.qmd
      - text: "Publication & Reports"
        file: Publication_report.qmd
      - text: "Projects & Blog"
        file: Podcast_Blog.qmd
    right:
      - icon: envelope
        text: "Contact Me"
        file: contact.qmd
      - icon: github
        href: https://github.com/HabtamuBizuayehu?tab=repositories
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/habtamu-bizuayehu-94285980/
        target: _blank
      - icon: mortarboard-fill
        href: https://scholar.google.com.au/citations?hl=en&user=zHEXO-IAAAAJ
        target: _blank
      - icon: orcid
        text: ORCID
        href: https://orcid.org/0000-0002-1360-4909
        target: _blank
      - icon: youtube
        text: YouTube
        href: https://www.youtube.com/channel/UCLVKP0g8GvHhOh0kn20T8eg
        target: _blank

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    page-layout: article

